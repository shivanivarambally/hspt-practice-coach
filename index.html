{name:'Reading',seconds:145,passage:'At first, Maya disliked the empty lot beside her apartment building. It collected litter, and its cracked pavement made it feel forgotten. One Saturday, she saw several neighbors carrying gloves, bags of soil, and young plants through the gate. Curious, Maya joined them. Over the next month, the group removed trash, built small garden beds, and painted a bright mural. By summer, bees hovered over the flowers, and people who had never spoken before stopped to chat on the new benches. Maya began to see that the lot had been waiting for people to imagine something better.',items:[

['What caused Maya to become involved?',['She was asked to paint.','She saw neighbors improving the lot.','She wanted to collect bees.','She needed a place to sit.'],'B','Seeing the neighbors made her curious.'],
['Which event happened last?',['The group removed trash.','Maya saw neighbors enter.','Bees visited the flowers.','Garden beds were built.'],'C','The bees arrived by summer, after the work.'],

{name:'Language',seconds:200,items:[

{name:'Quantitative Skills',seconds:208,items:[

{name:'Reading',seconds:145,passage:'When Taro noticed that the creek behind his school had become cloudy after heavy rain, he wondered where the muddy water came from. His science teacher helped him organize an investigation. Taro and two classmates compared creek water on sunny days with water collected after storms. They also made a model hillside in a tray. When they poured water over bare soil, much of the soil washed away. When they covered the soil with grass, far less moved. The students concluded that plant roots help hold soil in place. They shared their findings with the school, which later planted native grasses along the creek bank.',items:[
['Why did Taro begin the investigation?',['The creek was dry.','The creek became cloudy after rain.','His teacher assigned it.','He wanted to grow grass.'],'B','The first sentence gives the reason.'],['What did the tray model help students learn?',['How to measure rain','How roots reduce soil erosion','How to build a creek','How to identify grass'],'B','Less soil moved when grass covered it.'],['“Concluded” most nearly means _____.',['forgot','decided after studying evidence','announced without proof','asked a question'],'B','A conclusion follows evidence.'],['Which action used the students’ findings?',['Collecting sunny-day water','Planting grasses along the bank','Building a school','Pouring water in a tray'],'B','The school planted grasses after their report.'],['The passage is mainly about _____.',['a student investigation leading to a solution','unpredictable rain','safe creeks','difficult grasses'],'A','The investigation produces a practical action.'],['Which detail best shows evidence gathering?',['Taro noticed the creek.','They compared water under different conditions.','The school planted grasses.','The teacher helped.'],'B','Comparison provides evidence.']]},
{name:'Mathematics',seconds:253,items:[
['What is 5/6 − 1/4?',['1/2','7/12','2/3','3/8'],'B','10/12 − 3/12 = 7/12.'],['Solve: 3x + 4 = 19.',['3','5','7','15'],'B','Subtract 4, then divide by 3.'],['A number is increased by 20% from 50. What is the new value?',['55','60','65','70'],'B','20% of 50 is 10.'],['A rectangle has area 48 square units and width 6. What is its length?',['6','8','12','42'],'B','Length = area ÷ width.'],['What is 7² − 3²?',['16','24','40','58'],'C','49 − 9 = 40.'],['An angle on a straight line measures 180°. If one part is 70°, the other is _____.',['90°','100°','110°','120°'],'C','180 − 70 = 110.']]},
{name:'Language',seconds:150,items:[
['Choose the correct sentence.',['Its going to rain.','It’s going to rain.','Its’ going to rain.','Its going too rain.'],'B','It’s means it is.'],['Lena studied every evening. _____, she felt prepared.',['However','Therefore','Meanwhile','For example'],'B','The second sentence is a result.'],['The coach praised the players for _____ effort.',['there','they’re','their','theirs'],'C','Their shows possession.'],['Which is capitalized correctly?',['My aunt moved to Denver, Colorado.','My Aunt moved to Denver, colorado.','My aunt moved to denver, Colorado.','My Aunt moved to Denver, colorado.'],'A','Denver and Colorado are proper nouns.'],['Which has correct subject-verb agreement?',['The group of students are ready.','The group of students is ready.','The students in the group is ready.','The group and students is ready.'],'B','Group is the singular subject.'],['Which sentence is clearest?',['At this point in time, we are currently ready.','We are ready now.','We are ready at this time currently.','Currently, at this point, readiness is ours.'],'B','It is direct and concise.']]}]},

{name:'Quantitative Skills',seconds:208,items:[
['What number comes next? 81, 27, 9, 3, _____.',['0','1','2','6'],'B','Divide by 3 each time.'],['Which is greatest?',['5/8','0.62','61%','3/5'],'A','5/8 is 0.625.'],['A $45 backpack is on sale for $9 off. What is the sale price?',['$36','$39','$45','$54'],'A','45 − 9 = 36.'],['If 6 workers finish a task in 4 days at the same rate, how many worker-days are needed?',['10','20','24','30'],'C','6 × 4 = 24 worker-days.'],['A square has area 49. What is its side length?',['6','7','8','14'],'B','7 × 7 = 49.'],['If y = 3x and x = 4, what is y?',['7','12','16','24'],'B','3 × 4 = 12.']]},
{name:'Reading',seconds:145,passage:'For years, the town library displayed its old maps in a locked cabinet. Most visitors walked past without noticing them. Then a volunteer named Rosa suggested scanning the maps and placing digital copies on a public website. Students began using the maps to compare old neighborhoods with new ones, and longtime residents wrote notes about places they remembered. The project did not replace the original maps; it gave more people a reason to study them. Soon, the library added photographs and newspaper clippings to the collection as well.',items:[
['Why were the maps originally overlooked?',['They were damaged.','They were locked away and easy to miss.','They were too new.','They were difficult to scan.'],'B','The passage says visitors walked past the locked cabinet.'],['What was Rosa’s suggestion?',['Sell the maps.','Replace maps with photos.','Create digital copies for public use.','Move the library.'],'C','She suggested scanning and publishing them online.'],['What did students do with the maps?',['Repaired them','Compared past and present neighborhoods','Wrote newspapers','Locked them away'],'B','The passage states this directly.'],['The project mainly _____.',['made original maps unnecessary','increased interest in the original maps','reduced the library collection','changed neighborhood names'],'B','Digital access encouraged more study.'],['Which word best describes Rosa?',['observant','forgetful','impatient','uncertain'],'A','She noticed a way to make the maps useful.'],['What happened after the map project succeeded?',['The cabinet was removed.','The library added other historical materials.','Students stopped visiting.','The maps were sold.'],'B','Photos and clippings were added.']]},
{name:'Mathematics',seconds:253,items:[
['What is 2.5 + 0.75?',['2.80','3.15','3.25','3.75'],'C','2.50 + 0.75 = 3.25.'],['Solve: 4(x − 2) = 20.',['3','5','7','10'],'C','Divide by 4, then add 2.'],['A $60 meal has a 15% tip. What is the tip?',['$6','$9','$12','$15'],'B','10% is $6 and 5% is $3.'],['What is the volume of a rectangular prism 3 by 4 by 5?',['12','20','47','60'],'D','Multiply length, width, and height.'],['Which ratio is equal to 2:3?',['8:9','10:15','12:15','15:20'],'B','Both terms are multiplied by 5.'],['A circle has diameter 14. What is its radius?',['5','7','14','28'],'B','Radius is half the diameter.']]},
{name:'Language',seconds:150,items:[
['Which word completes the sentence? “The music _____ softly.”',['play','plays','playing','played are'],'B','Music is singular, so it plays.'],['Which sentence uses commas correctly?',['My brother who lives in Texas visits often.','My brother, who lives in Texas, visits often.','My brother who, lives in Texas visits often.','My brother, who lives in Texas visits, often.'],'B','The extra information is set off by commas.'],['Choose the correct word: “Please _____ your name at the top.”',['right','write','rite','writ'],'B','Write means put words on paper.'],['Which sentence has correct punctuation?',['“Are you ready”? asked Kim.','“Are you ready?” asked Kim.','“Are you ready”, asked Kim.','“Are you ready.” asked Kim.'],'B','The question mark belongs inside the quotation marks.'],['Which sentence is a fragment?',['The team practiced after school.','Because the team practiced after school.','The team practiced, and then it left.','After school, the team practiced.'],'B','It begins with because but lacks a complete main clause.'],['Which sentence is most concise?',['The reason is because we were late.','We were late.','We were late for the reason that we were late.','It was due to lateness that we were late.'],'B','It is direct and does not repeat itself.']]}]},
{id:'english-boost-1',title:'English Boost',desc:'Extra timed practice for the areas that need the most attention: vocabulary, reading, grammar, and clear writing.',sections:[
{name:'Verbal Skills',seconds:128,items:[
['Which word is closest in meaning to “diligent”?',['hardworking','careless','silent','ordinary'],'A','Diligent means hardworking.'],['Which word is opposite in meaning to “expand”?',['enlarge','stretch','reduce','develop'],'C','Reduce means make smaller.'],['Map is to direction as clock is to _____.',['time','distance','weather','sound'],'A','A clock gives time.'],['Which word does NOT belong?',['admire','respect','value','ignore'],'D','Ignore is unlike the others.'],['A surgeon works in a hospital; a teacher works in a _____.',['school','library','stadium','laboratory'],'A','A teacher commonly works in a school.'],['Which word best completes the sentence? “Her explanation was so _____ that everyone understood.”',['confusing','clear','quiet','hidden'],'B','Clear means easy to understand.'],['Finger is to hand as toe is to _____.',['shoe','foot','leg','sock'],'B','A toe is part of a foot.'],['To observe means to _____.',['watch carefully','speak loudly','move quickly','forget completely'],'A','Observe means watch carefully.']]},
{name:'Reading',seconds:193,passage:'Every spring, the students at Oak Street School held a used-book drive. At first, the books were simply placed in boxes near the office. This year, however, a group of students decided to sort the donations by reading level and subject. They made colorful signs and invited younger students to browse during lunch. By the end of the week, many children had chosen books they were excited to take home. The organizers noticed that books about animals and mysteries disappeared first, while several boxes of older textbooks remained. Next year, they plan to ask families to donate more storybooks and fewer outdated school materials.',items:[
['What changed this year?',['The drive was canceled.','Students sorted books and invited others to browse.','Only textbooks were collected.','Families stopped donating.'],'B','The passage describes sorting and lunchtime browsing.'],['Why did the organizers make signs?',['To sell books','To help students find books','To decorate the office','To label textbooks'],'B','The signs helped younger students browse.'],['Which books were most popular?',['Older textbooks','Animal and mystery books','School materials','Books near the office'],'B','Those categories disappeared first.'],['What can be inferred about older textbooks?',['They were borrowed quickly.','They were less appealing to students.','They were about animals.','They were newly published.'],'B','Several boxes remained while other books were chosen.'],['The main purpose of the final sentence is to show that the organizers _____.',['will improve the next drive using what they learned','want to end the book drive','plan to collect only textbooks','do not like storybooks'],'A','They adjust future donations based on results.'],['Which word best describes the organizers?',['observant','careless','uninterested','confused'],'A','They noticed which books students chose.'],['What is the passage mainly about?',['How one school improved a book drive','Why textbooks are expensive','How to write a mystery','Why spring is busy'],'A','The changes and results of the drive are central.'],['What evidence supports the idea that students liked the new system?',['Books stayed in boxes.','Many children chose books to take home.','The office was decorated.','Families donated textbooks.'],'B','This is direct evidence of engagement.']]},
{name:'Language',seconds:200,items:[
['Choose the correct sentence.',['Everyone brought their pencil.','Everyone brought there pencil.','Everyone brought they’re pencil.','Everyone brought they pencil.'],'A','Their shows possession.'],['Which sentence has correct subject-verb agreement?',['The basket of apples are heavy.','The basket of apples is heavy.','The apples in the basket is heavy.','The basket and apples is heavy.'],'B','Basket is the singular subject.'],['Choose the correct word: “We _____ the movie yesterday.”',['see','saw','seen','seeing'],'B','Saw is the past-tense verb.'],['Which sentence is punctuated correctly?',['Before we left, we checked the door.','Before, we left we checked the door.','Before we left we, checked the door.','Before we left, we checked, the door.'],'A','Use one comma after the introductory clause.'],['Which word correctly completes the sentence? “The team celebrated _____ victory.”',['it’s','its','its’','it'],'B','Its is possessive; it’s means it is.'],['Which sentence is a complete sentence?',['Although the rain continued.','Because the trail was muddy.','The hikers waited under a shelter.','While the wind was blowing.'],'C','It expresses a complete thought.'],['Choose the clearest revision: “The reason for the delay was because the bus was late.”',['The delay was because the bus was late.','The bus was late, causing the delay.','The reason for the delay was due to lateness.','Because of the bus, there was a delay reason.'],'B','It is direct and avoids repetition.'],['Which word is spelled correctly?',['definately','definitely','definatly','definetely'],'B','Definitely is the correct spelling.']]}]}

{name:'Reading',seconds:145,passage:'When the city proposed replacing an unused rail corridor with a paved trail, some residents objected. They worried that construction would disturb nearby homes and that a trail would attract noise. Supporters, however, pointed to studies from other cities showing that well-designed trails often increased access to parks and local businesses. After several public meetings, the city approved a narrower trail with native plants along its edges and limited lighting near homes. A year after it opened, a survey found that many residents used the trail for walking or biking, while nearby shop owners reported more visitors. The project did not eliminate every complaint, but it showed how a plan can change when people identify specific concerns.',items:[

const L=['A','B','C','D'];let run=null,tick=null,demo=null;const key='hspt-practice-coach-v1';const $=s=>document.querySelector(s);const saved=()=>JSON.parse(localStorage.getItem(key)||'[]');const put=x=>localStorage.setItem(key,JSON.stringify(x));
function format(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function practiceHome(){run=null;demo=null;clearInterval(tick);$('#practice').innerHTML=`<div class="card"><h1>Choose a practice run</h1><p>Each test is deliberately short. It uses HSPT-style time pressure without replacing a paper practice test.</p><div class="test-grid"><div class="test-card"><h3>Interface warm up</h3><p>Three mock questions to learn the buttons, timer, and answer selection. No score and no saved results.</p><div class="meta">3 questions • 2 minute practice timer • reset anytime</div><br><button class="primary" onclick="beginDemo()">Try the interface</button></div>${T.map(t=>{const q=t.sections.reduce((n,s)=>n+s.items.length,0),sec=t.sections.reduce((n,s)=>n+s.seconds,0);return `<div class="test-card"><h3>${t.title}</h3><p>${t.desc}</p><div class="meta">${q} questions • ${format(sec)} total • ${t.sections.map(s=>s.name).join(', ')}</div><br><button class="primary" onclick="begin('${t.id}')">Start timed test</button></div>`}).join('')}</div></div>`}
const D=[['This is a mock question. Choose any answer to see how a selection is highlighted.',['One','Two','Three','Four']],['Use the Next question button after choosing an answer.',['A sample','Another sample','A third sample','A fourth sample']],['Use Previous to revisit an answer. The Reset mock button starts over.',['Ready','Set','Practice','Go']]];
window.beginDemo=()=>{run=null;clearInterval(tick);demo={q:0,answers:{},remaining:120};tick=setInterval(()=>{if(!demo)return;demo.remaining--;if(demo.remaining<=0)demoDone();else demoShow()},1000);demoShow()};
function demoShow(){const x=D[demo.q],a=demo.answers[demo.q];$('#practice').innerHTML=`<div class="card"><div class="runbar"><div><div class="qnum">Interface warm up • Mock question ${demo.q+1} of ${D.length}</div><strong>No evaluation or saved results</strong></div><div><div class="qnum">Practice timer</div><div class="timer">${format(demo.remaining)}</div></div></div><div class="notice">Try selecting an answer, using Previous and Next, then Reset mock. Nothing here affects a score.</div><div class="progress"><div style="width:${demo.q/D.length*100}%"></div></div><div class="stem">${x[0]}</div>${x[1].map((o,i)=>`<button class="choice ${a===L[i]?'selected':''}" onclick="demoAnswer('${L[i]}')"><b>${L[i]}.</b> ${o}</button>`).join('')}<div class="actions"><button class="outline" onclick="demoPrevious()" ${demo.q===0?'disabled':''}>Previous</button><div><button class="outline" onclick="beginDemo()">Reset mock</button> <button class="primary" onclick="demoNext()">${demo.q===D.length-1?'Finish mock':'Next question'}</button></div></div></div>`}
window.demoAnswer=v=>{demo.answers[demo.q]=v;demoShow()};window.demoPrevious=()=>{if(demo.q){demo.q--;demoShow()}};window.demoNext=()=>{if(demo.q<D.length-1){demo.q++;demoShow()}else demoDone()};function demoDone(){clearInterval(tick);demo=null;$('#practice').innerHTML=`<div class="card"><h1>Warm up complete</h1><p>No results were scored or saved. He can repeat this mock as often as he likes, then choose a real mini test when comfortable.</p><button class="primary" onclick="beginDemo()">Reset mock</button> <button class="outline" onclick="practiceHome()">Back to tests</button></div>`}
window.begin=id=>{const test=T.find(x=>x.id===id);run={test,si:0,qi:0,answers:{},events:[],remaining:test.sections[0].seconds,started:Date.now(),sectionStarted:Date.now()};showQuestion();tick=setInterval(()=>{if(!run)return;run.remaining--;if(run.remaining<=0){timeUp()}else updateClock()},1000)};
function section(){return run.test.sections[run.si]}function item(){return section().items[run.qi]}
function updateClock(){const c=$('#clock');if(c)c.textContent=format(run.remaining);const b=$('#bar');if(b)b.style.width=`${((run.qi+(section().items.length?0:0))/section().items.length)*100}%`}
function showQuestion(){const s=section(),x=item(),id=`${run.si}-${run.qi}`,a=run.answers[id];$('#practice').innerHTML=`<div class="card"><div class="runbar"><div><div class="qnum">${s.name} • Question ${run.qi+1} of ${s.items.length}</div><strong>${run.test.title}</strong></div><div><div class="qnum">Time left</div><div class="timer" id="clock">${format(run.remaining)}</div></div></div><div class="progress"><div id="bar" style="width:${run.qi/s.items.length*100}%"></div></div>${s.passage?`<div class="passage">${s.passage}</div>`:''}<div class="stem">${x[0]}</div>${x[1].map((o,i)=>`<button class="choice ${a===L[i]?'selected':''}" onclick="answer('${L[i]}')"><b>${L[i]}.</b> ${o}</button>`).join('')}<div class="actions"><button class="outline" onclick="previous()" ${run.qi===0?'disabled':''}>Previous</button><button class="primary" onclick="next()">${run.qi===s.items.length-1?'Finish section':'Next question'}</button></div></div>`}
window.answer=v=>{const id=`${run.si}-${run.qi}`,before=run.answers[id];run.answers[id]=v;run.events.push({id,answer:v,changed:!!before&&before!==v,at:Date.now()-run.sectionStarted});showQuestion()};window.previous=()=>{if(run.qi>0){run.qi--;showQuestion()}};
window.next=()=>{if(run.qi<section().items.length-1){run.qi++;showQuestion()}else finishSection(false)};function timeUp(){finishSection(true)}
function finishSection(expired){clearInterval(tick);const unanswered=section().items.filter((_,i)=>!run.answers[`${run.si}-${i}`]).length;if(expired&&unanswered){$('#practice').innerHTML=`<div class="card"><h2>Time is up for ${section().name}</h2><p>${unanswered} question${unanswered===1?' was':'s were'} left unanswered. On the actual HSPT, make your best guess—there is no penalty for a wrong answer.</p><button class="primary" onclick="advance()">Continue</button></div>`}else advance()}
window.advance=()=>{if(run.si<run.test.sections.length-1){run.si++;run.qi=0;run.remaining=section().seconds;run.sectionStarted=Date.now();tick=setInterval(()=>{if(!run)return;run.remaining--;if(run.remaining<=0)timeUp();else updateClock()},1000);showQuestion()}else complete()};
function complete(){clearInterval(tick);const results=run.test.sections.map((s,si)=>{let correct=0,answered=0,changes=0;s.items.forEach((x,qi)=>{const e=run.answers[`${si}-${qi}`];if(e){answered++;if(e===x[2])correct++}changes+=run.events.filter(y=>y.id===`${si}-${qi}`&&y.changed).length});return {name:s.name,total:s.items.length,correct,answered,changes}});const attempt={id:Date.now(),title:run.test.title,date:new Date().toLocaleString(),results,answers:run.answers,events:run.events};const a=saved();a.unshift(attempt);put(a);const total=results.reduce((n,x)=>n+x.total,0),right=results.reduce((n,x)=>n+x.correct,0);$('#practice').innerHTML=`<div class="card"><h1>Practice complete</h1><p class="score">${right}/${total}</p><p>${Math.round(right/total*100)}% correct. Your results are saved on this computer for the parent review tab.</p><table class="table"><tr><th>Section</th><th>Score</th><th>Changed answers</th></tr>${results.map(r=>`<tr><td>${r.name}</td><td>${r.correct}/${r.total}</td><td>${r.changes}</td></tr>`).join('')}</table><br><button class="primary" onclick="exportRun(${attempt.id})">Copy results for email</button> <button class="outline" onclick="practiceHome()">Choose another test</button></div>`;run=null}
const originalBegin=window.begin;
window.begin=id=>{originalBegin(id);run.sectionTimes={};};
const originalFinishSection=finishSection;
finishSection=function(expired){if(run){run.sectionTimes=run.sectionTimes||{};run.sectionTimes[run.si]={elapsed:Math.round((Date.now()-run.sectionStarted)/1000),limit:section().seconds,timedOut:expired};}return originalFinishSection(expired)};
complete=function(){clearInterval(tick);const results=run.test.sections.map((s,si)=>{let correct=0,answered=0,changes=0;s.items.forEach((x,qi)=>{const e=run.answers[`${si}-${qi}`];if(e){answered++;if(e===x[2])correct++}changes+=run.events.filter(y=>y.id===`${si}-${qi}`&&y.changed).length});const timing=run.sectionTimes?.[si]||{elapsed:s.seconds,limit:s.seconds,timedOut:true};return {name:s.name,total:s.items.length,correct,answered,changes,...timing}});const attempt={id:Date.now(),title:run.test.title,date:new Date().toLocaleString(),durationSeconds:Math.round((Date.now()-run.started)/1000),results,answers:run.answers,events:run.events};const a=saved();a.unshift(attempt);put(a);const total=results.reduce((n,x)=>n+x.total,0),right=results.reduce((n,x)=>n+x.correct,0);$('#practice').innerHTML=`<div class="card"><h1>Practice complete</h1><p class="score">${right}/${total}</p><p>Completed in <b>${format(attempt.durationSeconds)}</b>. Your results are saved on this computer for the parent review tab.</p><table class="table"><tr><th>Section</th><th>Score</th><th>Time used</th><th>Changed answers</th></tr>${results.map(r=>`<tr><td>${r.name}</td><td>${r.correct}/${r.total}</td><td>${format(r.elapsed)} / ${format(r.limit)}</td><td>${r.changes}</td></tr>`).join('')}</table><br><button class="primary" onclick="exportRun(${attempt.id})">Copy results for email</button> <button class="outline" onclick="practiceHome()">Choose another test</button></div>`;run=null};
function review(){const a=saved();$('#review').innerHTML=a.length?`<div class="card"><h1>Parent review</h1><p class="small">Results are stored only in this browser on this computer. “Changed answers” is a useful signal of second-guessing, not an error by itself.</p>${a.map(x=>{const right=x.results.reduce((n,r)=>n+r.correct,0),total=x.results.reduce((n,r)=>n+r.total,0);return `<details><summary>${x.title} — ${right}/${total} (${Math.round(right/total*100)}%) <span class="small">${x.date}${x.durationSeconds?' • '+format(x.durationSeconds):''}</span></summary><table class="table"><tr><th>Section</th><th>Correct</th><th>Time used</th><th>Changed answers</th></tr>${x.results.map(r=>`<tr><td>${r.name}</td><td class="${r.correct/r.total>=.8?'good':'bad'}">${r.correct}/${r.total}</td><td>${r.elapsed!==undefined?format(r.elapsed)+' / '+format(r.limit):'Not recorded'}</td><td>${r.changes}</td></tr>`).join('')}</table><br><button class="outline" onclick="exportRun(${x.id})">Copy detailed summary for Codex</button></details>`}).join('')}</div>`:`<div class="card empty"><h2>No saved practice runs yet</h2><p>Complete a timed test and its results will appear here.</p></div>`}
function summaryText(id){const a=saved().find(x=>x.id===id),test=T.find(x=>x.title===a.title);let lines=[`HSPT Practice Coach summary — ${a.title}`,`Completed: ${a.date}`];test.sections.forEach((s,si)=>{const r=a.results[si];lines.push(`\n${s.name}: ${r.correct}/${r.total}; answered ${r.answered}/${r.total}; changed answers ${r.changes}`);s.items.forEach((x,qi)=>{const k=`${si}-${qi}`,events=a.events.filter(e=>e.id===k),chosen=a.answers[k]||'blank',first=events[0]?Math.round(events[0].at/1000)+' sec':'not answered';lines.push(`Q${qi+1}: ${chosen} ${chosen===x[2]?'correct':'incorrect'}; first answer at ${first}; changes ${events.filter(e=>e.changed).length}`)})});return lines.join('\n')}
window.exportRun=id=>{const text=summaryText(id);navigator.clipboard?.writeText(text);$('#practice').classList.remove('hidden');$('#review').classList.add('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view==='practice'));$('#practice').innerHTML=`<div class="card"><h1>Results ready to send</h1><p>The summary below has been copied to the clipboard when the browser permits it. You can paste it into an email, or select the text below and copy it manually.</p><textarea id="summary" style="width:100%;min-height:360px;padding:12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line);border-radius:8px">${text}</textarea><br><br><button class="primary" onclick="copySummary()">Copy results</button> <button class="outline" onclick="practiceHome()">Back to tests</button></div>`;setTimeout(()=>document.querySelector('#summary')?.select(),0)};
window.copySummary=()=>{const text=$('#summary').value;navigator.clipboard?.writeText(text);$('#summary').select();alert('Results are ready to paste into an email.');};
summaryText=function(id){const a=saved().find(x=>x.id===id),test=T.find(x=>x.title===a.title);let lines=[`HSPT Practice Coach summary — ${a.title}`,`Completed: ${a.date}`,`Total completion time: ${a.durationSeconds!==undefined?format(a.durationSeconds):'Not recorded for this earlier attempt'}`];test.sections.forEach((s,si)=>{const r=a.results[si],time=r.elapsed!==undefined?`${format(r.elapsed)} of ${format(r.limit)}`:'Not recorded';lines.push(`\n${s.name}: ${r.correct}/${r.total}; time ${time}; answered ${r.answered}/${r.total}; changed answers ${r.changes}`);s.items.forEach((x,qi)=>{const k=`${si}-${qi}`,events=a.events.filter(e=>e.id===k),chosen=a.answers[k]||'blank',first=events[0]?Math.round(events[0].at/1000)+' sec':'not answered';lines.push(`Q${qi+1}: ${chosen} ${chosen===x[2]?'correct':'incorrect'}; first answer at ${first}; changes ${events.filter(e=>e.changed).length}`)})});return lines.join('\n')};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const r=b.dataset.view==='review';$('#practice').classList.toggle('hidden',r);$('#review').classList.toggle('hidden',!r);if(r)review()});$('#clearData').onclick=()=>{if(confirm('Clear all saved practice history from this browser?')){localStorage.removeItem(key);review()}};practiceHome();
